name: Release

# 推送 v* 标签时自动打包（macOS / Windows / Linux）并上传到 GitHub Releases
#
# 用法：
#   1. 确保 app/package.json 的 version 与标签一致（如 v0.28.0 ↔ "0.28.0"）
#   2. 打标签并推送：git tag v0.28.0 && git push origin v0.28.0
#   3. 构建完成后，仓库 Releases 页面会自动出现可下载的安装包
#
# 注意：未配置代码签名证书时，macOS 安装包为未签名版本，
#       首次打开需在「系统设置 → 隐私与安全性」中手动允许。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            command: build:mac
          - os: windows-latest
            command: build:win
          - os: ubuntu-latest
            command: build:linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Verify tag matches package.json version
        working-directory: app
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build & publish (${{ matrix.os }})
        working-directory: app
        env:
          # 未配置签名证书时跳过代码签名检索，保证 CI 可构建
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # electron-builder 用 GitHub 自动上传产物到当前 tag 的 Release
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run ${{ matrix.command }} -- --publish always

      # 保险兜底：若 electron-builder 上传异常，仍将产物挂到 Release
      - name: Upload artifacts to GitHub Release (fallback)
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/release/*.dmg
            app/release/*.zip
            app/release/*.exe
            app/release/*.AppImage
            app/release/*.deb
            app/release/*.blockmap
          generate_release_notes: true
