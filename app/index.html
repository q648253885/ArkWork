<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      ★ v0.36.0（D90）frame-src 必须放行 `arkwork-plugin:`
        —— 插件代码视图（v0.35.0）用 `<iframe src="arkwork-plugin://<id>/xxx.html">`
           装载客户端半；本页这条 CSP 若不列该 scheme，Chromium 在建框阶段就拒绝
           （`net::ERR_BLOCKED_BY_CSP`，子框架退化成 `chrome-error://chromewebdata/`
           即**一片纯白**，且宿主侧没有任何报错提示）—— 用户实测「git 侧边栏点进去
           全是白色」的第一层根因。
        约束：本行与 `main/plugins/protocol.ts` 的 `PLUGIN_SCHEME` 是**同一事实的
        两个副本**，由 `src/main/plugins/__tests__/plugin-frame-src-contract.test.ts`
        （TC-PFS-001/002）逐字校验，改一处必须改两处。
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' https: http://127.0.0.1:* http://localhost:*; frame-src 'self' https: http: data: file: arkwork-plugin:; img-src 'self' data: https: http:" />
    <title>ArkWork — AI Agent Workbench</title>
    <!--
      v0.21.0 — 参考 deepseek-harness-desktop（DSH），改用系统字体栈：
        移除 Google Fonts 上的 Inter / JetBrains Mono 外链依赖，
        改用 native 系统字体（macOS SF Pro / Windows Segoe UI / Linux Cantarell）
        渲染 Chinese 字体则依赖系统 PingFang SC / Microsoft YaHei / Noto Sans CJK。
        系统字体在不同平台上能给出最一致的渲染效果，且无外部网络依赖。
    -->
    <script>
      // v0.4.0 — 无闪烁主题脚本
      // 在 React 渲染前根据 localStorage 决定 <html class="dark">，
      // 避免"先白后黑"或"先黑后白"的闪烁。
      // 逻辑与 store.ts applyThemeClass 对齐：
      //   - 'dark'                     → dark
      //   - 'light'                    → light（移除 dark）
      //   - 'system'                   → 跟随 prefers-color-scheme
      //   - 缺省                       → dark（与 v0.3.0 默认深色一致）
      (function () {
        try {
          var t = localStorage.getItem('arkwork:theme');
          var resolved;
          if (t === 'light') resolved = 'light';
          else if (t === 'system') {
            resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          } else {
            // 'dark' 或 null/undefined → 默认深色
            resolved = 'dark';
          }
          if (resolved === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {
          // localStorage 不可用（隐私模式等），默认深色
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <script type="module" crossorigin src="./assets/index-CHqWXFQu.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/globals-DGqL-h8f.js">
    <link rel="stylesheet" crossorigin href="./assets/globals-WNm7ZTol.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
